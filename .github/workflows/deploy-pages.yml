name: Deploy GitHub Pages

# Pages source must be set to "GitHub Actions" in repo Settings → Pages.
on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check-ci
      - run: bun run build
        env:
          # https://www.openstreetmap.org/oauth2/applications/13548 (OSM user: tordans)
          OSM_OAUTH_CLIENT_ID: a_Pr1K-tsRQ0GgdrsR9daU0hPtRZCTig031wF-zh3Tc
          # https://master.apis.dev.openstreetmap.org/oauth2/applications/1390 (OSM user: tordansdev)
          OSM_OAUTH_CLIENT_ID_DEV: rC3hbP0P5mj4-ZO5EaHXh-g2o6scRZceIvJ9lwJ8Xiw
      - run: cp app/dist/index.html app/dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
